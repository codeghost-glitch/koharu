name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: windows-latest
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: koharu-app-windows-latest
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: windows-latest-bun-${{ hashFiles('**/bun.lock') }}
      - run: bun install
      - run: bun run build
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: koharu-windows-latest
          path: |
            target/release/koharu*
          retention-days: 14
